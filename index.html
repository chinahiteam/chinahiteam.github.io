:root{
  --pink:#FCD1EA; --pink-deep:#F5A9D0; --ink:#111111; --paper:#FFF9FC;
  --muted:#8A7480; --ok:#1B7F5A; --no:#C1362F; --line:rgba(17,17,17,.14); --r:18px;
  --display:'Comfortaa','Trebuchet MS',system-ui,sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light only;background:var(--pink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;padding:0;background:var(--pink);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;min-height:100dvh;overscroll-behavior-y:none}
body.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (prefers-color-scheme:dark){html,body{background:var(--pink);color:var(--ink)}}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-top:max(22px,env(safe-area-inset-top));
  padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px));
  padding-left:max(18px,env(safe-area-inset-left));
  padding-right:max(18px,env(safe-area-inset-right))}

.brandbar{display:flex;align-items:baseline;gap:10px;margin-bottom:26px}
.brandbar b{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.5px}
.brandbar span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

h1{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.25;margin:0 0 8px}
h2{font-family:var(--display);font-weight:420;font-size:17px;margin:0 0 10px}
p.lead{margin:0 0 22px;color:#3A2F35;font-size:15px}
.small{font-size:13px;color:var(--muted);line-height:1.45}

.field{margin-bottom:20px}
.field label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:15px 16px;border:1.5px solid var(--ink);border-radius:14px;
  background:var(--paper);font-family:var(--body);font-size:16px;color:var(--ink)}
.field input:focus{outline:3px solid var(--pink-deep);outline-offset:1px}

.modes{display:flex;gap:8px;margin-bottom:24px;background:rgba(255,255,255,.5);padding:5px;border-radius:15px}
.modes button{flex:1;padding:11px 6px;border:0;border-radius:11px;background:transparent;
  font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--pink)}

.warnbox{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;
  padding:14px 16px;margin:0 0 20px;font-size:13.5px;line-height:1.5}
.warnbox b{font-family:var(--display);font-weight:700;font-size:14px;display:block;margin-bottom:5px}

.tcard{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:17px 16px;
  margin-bottom:11px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--paper);
  cursor:pointer;font-family:var(--body);color:var(--ink);transition:transform .12s ease}
.tcard:active{transform:scale(.985)}
.tcard .num{font-family:var(--display);font-weight:700;font-size:19px;width:38px;height:38px;
  flex:0 0 38px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.tcard .body{flex:1;min-width:0}
.tcard .body strong{display:block;font-family:var(--display);font-weight:700;font-size:16px}
.tcard .body em{font-style:normal;font-size:12.5px;color:var(--muted)}
.tcard .score{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.tcard .score.pass{color:var(--ok)} .tcard .score.fail{color:var(--no)}

.btn{width:100%;padding:17px;border:0;border-radius:15px;background:var(--ink);color:var(--pink);
  font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  font-size:12.5px;color:var(--muted)}
.topline b{font-family:var(--display);color:var(--ink);font-size:13px}
.topline .warn{color:var(--no);font-weight:700}
.bar{height:5px;background:rgba(17,17,17,.13);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s ease}

.q{font-family:var(--display);font-weight:420;font-size:19px;line-height:1.4;margin:0 0 20px}
.opt{width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border:1.5px solid var(--ink);
  border-radius:14px;background:var(--paper);font-family:var(--body);font-size:15px;line-height:1.4;
  color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--display);font-weight:700;flex:0 0 auto;opacity:.5}
.opt[data-state="picked"]{background:var(--ink);color:var(--pink)}
.opt[data-state="picked"] .k{opacity:.8}
.opt[data-state="right"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[data-state="wrong"]{background:var(--no);border-color:var(--no);color:#fff}
.opt[data-state="right"] .k,.opt[data-state="wrong"] .k{opacity:.85}
.opt:disabled{cursor:default}

.explain{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;
  padding:14px 16px;margin:4px 0 8px;font-size:14px;line-height:1.5}
.explain b{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:var(--muted)}

.hint{display:block;margin-top:7px;font-size:12.5px;line-height:1.4;color:var(--no);font-weight:500}

.ans{display:block;padding:8px 11px;border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.4}
.ans span{display:block;font-family:var(--display);font-weight:700;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.ans.no{background:rgba(193,54,47,.13);color:var(--no)}
.ans.ok{background:rgba(27,127,90,.13);color:var(--ok)}

.ladder{margin:26px 0 8px}
.rung{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;
  margin-bottom:8px;border:1.5px solid transparent}
.rung.on{border-color:var(--ink);background:var(--paper)}
.rung .pc{font-family:var(--display);font-weight:700;font-size:20px;width:66px;flex:0 0 66px}
.rung .lb{flex:1;font-size:13.5px;color:var(--muted)}
.rung.on .lb{color:var(--ink);font-weight:700}
.rung svg{flex:0 0 34px}

.bignum{font-family:var(--display);font-weight:700;font-size:62px;line-height:1;letter-spacing:-2px;margin:6px 0 2px}
.rows{border-top:1px solid var(--line);margin:22px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.row b{font-family:var(--display);font-weight:700}
.row .pass{color:var(--ok)} .row .fail{color:var(--no)}

.note,.install{background:rgba(255,255,255,.55);border-radius:14px;padding:13px 15px;
  font-size:13px;line-height:1.5;color:#3A2F35;margin-top:16px}
.install b{font-family:var(--display);font-weight:700}
textarea{width:100%;min-height:190px;padding:13px;border:1.5px solid var(--ink);border-radius:14px;
  background:var(--paper);font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--ink)}
.spacer{flex:1}
.foot{margin-top:20px;display:flex;justify-content:center;gap:18px}
.link{background:none;border:0;font-family:var(--body);font-size:13px;color:var(--muted);
  text-decoration:underline;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

<div id="app"></div>

const TIERS=[
  {min:97,add:0.6,label:"Бездоганно"},
  {min:90,add:0.4,label:"Сильний рівень"},
  {min:80,add:0.2,label:"Норма"},
  {min:0, add:0,  label:"Не склав"}
];
const BASE=1.8, GATE=80;
const ORDER=["kitchen","bar","service"];
const KEYS=["А","Б","В","Г","Д"];

let S={name:"",screen:"home",test:null,qs:[],i:0,picked:null,
       answers:[],results:{},resets:0,startedAt:0,tLeft:0,timer:null,sent:{},pin:""};

const app=document.getElementById("app");
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>String(n).replace(".",",");
const tierOf=p=>TIERS.find(t=>p>=t.min);
const nameOk=()=>S.name.trim().length>=CONFIG.minNameLength;

const face=t=>{const m=["M11 22 Q17 24 23 22","M11 21 Q17 25 23 21","M10 20 Q17 27 24 20","M10 20 Q17 28 24 20"][t];
  const eyes=t===3?'<path d="M10 13 Q12.5 10.5 15 13" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><path d="M19 13 Q21.5 10.5 24 13" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>':'<circle cx="12.5" cy="13" r="1.7"/><circle cx="21.5" cy="13" r="1.7"/>';
  return `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#111" stroke-width="1.7"/>${eyes}<path d="${m}" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></svg>`;
};

function draw(){
  const b=BANK[S.test];
  const pool=b.q.map((q,i)=>({q,i}));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,Math.min(b.show,pool.length)).map(q=>{
    // варіанти теж перемішуємо — порядок відповідей не запам'ятати
    const opts=q.q[1].map((o,k)=>({o,k}));
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    return [q.q[0], opts.map(x=>x.o), opts.findIndex(x=>x.k===q.q[2]), q.q[3]];
  });
}

/* ---------- захист від списування ---------- */
function guardOn(){
  if(!CONFIG.resetOnLeave) return;
  document.addEventListener("visibilitychange",onLeave);
  window.addEventListener("blur",onLeave);
}
function guardOff(){
  document.removeEventListener("visibilitychange",onLeave);
  window.removeEventListener("blur",onLeave);
}
function onLeave(){
  if(S.screen!=="quiz") return;               // відкрите питання не обнуляємо
  if(document.visibilityState==="visible"&&document.hasFocus()) return;
  S.resets++;
  stopTimer();
  S.screen="broken";
  render();
}

/* ---------- таймер на питання ---------- */
function startTimer(){
  stopTimer();
  if(!CONFIG.secondsPerQuestion) return;
  S.tLeft=CONFIG.secondsPerQuestion;
  S.timer=setInterval(()=>{
    S.tLeft--;
    const el=document.getElementById("clock");
    if(el){el.textContent=S.tLeft+" с"; el.className=S.tLeft<=10?"warn":"";}
    if(S.tLeft<=0){stopTimer(); commit(true);}
  },1000);
}
function stopTimer(){ if(S.timer){clearInterval(S.timer);S.timer=null;} }

/* ---------- відправка менеджеру ---------- */
function payload(kind,extra){
  return Object.assign({
    kind, name:S.name||"без імені",
    date:new Date().toLocaleString("uk-UA"),
    resets:S.resets
  },extra);
}
function send(data){
  if(!CONFIG.endpoint) return;
  try{
    fetch(CONFIG.endpoint,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(data)});
  }catch(e){}
}
function reportText(){
  const rs=ORDER.map(k=>S.results[k]).filter(Boolean);
  const gate=rs.length===3&&rs.every(r=>r.p>=GATE);
  const avg=rs.length===3?Math.round(rs.reduce((s,r)=>s+r.p,0)/3*10)/10:0;
  const t=gate?tierOf(avg):TIERS[3];
  let out=`CHINA HI — атестація\n${S.name||"без імені"}\n${new Date().toLocaleString("uk-UA")}\n\n`;
  ORDER.forEach(k=>{const r=S.results[k];
    out+=`${BANK[k].title}: ${r?nf(r.p)+"% ("+r.correct+"/"+r.total+")":"не складено"}\n`});
  if(rs.length===3){
    out+=`\nСередній бал: ${nf(avg)}%\nПерезапусків: ${S.resets}\n`;
    out+=`Підсумок: ${nf(BASE+t.add)}% — ${t.label}\n`;
  }
  const miss=[];
  ORDER.forEach(k=>{const r=S.results[k]; if(!r) return;
    r.wrong.forEach(w=>miss.push(
      `• [${BANK[k].title}] ${w.q}\n   відповів: ${w.given}\n   правильно: ${w.right}`))});
  if(miss.length){
    const to=miss.filter(x=>x.includes("не встиг")).length;
    out+=`\nПомилок: ${miss.length}${to?` (з них не встиг відповісти: ${to})`:""}\n\n${miss.join("\n\n")}\n`;
  }else if(ORDER.every(k=>S.results[k])){
    out+="\nПомилок немає.\n";
  }

  const op=ORDER.filter(k=>S.results[k]&&S.results[k].open);
  if(op.length){
    out+="\n\nВІДКРИТІ ПИТАННЯ\n";
    op.forEach(k=>{const o=S.results[k].open;
      out+=`\n[${BANK[k].title}] ${o.q}\n   ${o.a}\n`});
  }
  return out;
}

/* ---------- екрани ---------- */
function render(){
  const f={home,quiz,open:openScreen,broken,"test-done":testDone,final,import:importer,manager}[S.screen]||home;
  app.innerHTML=f();
  document.body.classList.toggle("noselect",S.screen==="quiz");
  window.scrollTo(0,0);
}
const head=()=>`<div class="brandbar"><b>hi</b><span>атестація команди</span></div>`;

function home(){
  const ready=ORDER.every(k=>S.results[k]);
  const ok=nameOk();
  return head()+`
  <h1>Три тести — і ти знаєш свій відсоток</h1>
  <p class="lead">Кухня, бар, сервіс. У кожному треба щонайменше ${GATE}%. Далі середній бал вирішує надбавку до базових ${nf(BASE)}%.</p>

  <div class="field"><label>Твоє ім'я та прізвище</label>
    <input id="nm" value="${esc(S.name)}" placeholder="Наприклад: Марія Коваль" autocomplete="off">
    <span class="hint" id="nmhint" style="${ok?"display:none":""}">Без імені тест не почнеться — менеджер має знати, чий це результат.</span>
  </div>

  <div class="warnbox"><b>Як це працює</b>
    ${CONFIG.secondsPerQuestion} секунд на питання. Останнє питання в кожному тесті — відкрите, там час не обмежено.
    Не згортай додаток і не перемикайся на інші застосунки — спроба почнеться заново з новими питаннями.
    Дзвінок чи сповіщення теж обнулять спробу, тому склади тест у спокійний момент.</div>

  ${ORDER.map((k,n)=>{
    const b=BANK[k], r=S.results[k];
    const sc=r?`<span class="score ${r.p>=GATE?'pass':'fail'}">${nf(r.p)}%</span>`:"";
    return `<button class="tcard" data-test="${k}" ${ok?"":"disabled"}>
      <span class="num">${n+1}</span>
      <span class="body"><strong>${b.title}</strong><em>${Math.min(b.show,b.q.length)} + 1 відкрите${r?` · ${r.p>=GATE?'зараховано':'нижче порога'}`:""}</em></span>
      ${sc}</button>`}).join("")}

  ${ready?`<button class="btn" id="fin">Мій підсумок</button>`:""}

  <div class="spacer"></div>
  <div class="foot">
    <button class="link" id="mgr">Для менеджера</button>
    <button class="link" id="imp">Додати питання</button>

}

function quiz(){
  const q=S.qs[S.i], n=S.qs.length;
  return `<div class="topline"><b>${BANK[S.test].title}</b>
    <span><span id="clock" class="${S.tLeft<=10?'warn':''}">${S.tLeft} с</span> · ${S.i+1} / ${n+1}</span></div>
  <div class="bar"><i style="width:${S.i/(n+1)*100}%"></i></div>
  <p class="q">${esc(q[0])}</p>
  ${q[1].map((o,k)=>`<button class="opt" data-opt="${k}" data-state="${S.picked===k?'picked':''}">
      <span class="k">${KEYS[k]}</span><span>${esc(o)}</span></button>`).join("")}
  <button class="btn" id="nx" ${S.picked===null?"disabled":""}>Далі</button>`;
}

function openScreen(){
  const n=S.qs.length;
  return `<div class="topline"><b>${BANK[S.test].title}</b>
    <span>без ліміту часу · ${n+1} / ${n+1}</span></div>
  <div class="bar"><i style="width:${n/(n+1)*100}%"></i></div>
  <p class="q">${esc(OPEN_Q[S.test])}</p>
  <p class="small" style="margin:-10px 0 14px">Відповідай своїми словами. Балів це питання не дає — його читає менеджер, щоб зрозуміти, як ти міркуєш.</p>
  <textarea id="oa" placeholder="Пиши тут…"></textarea>
  <span class="hint" id="oahint" style="display:none">Напиши хоча б кілька речень — коротка відмовка не зараховується.</span>
  <button class="btn" id="doneopen">Завершити тест</button>`;

function broken(){
  return head()+`
  <h1>Спроба обнулена</h1>
  <p class="lead">Додаток згорнувся або втратив фокус. Так працює захист від підказок: питання перемішано заново, лічильник почався з нуля.</p>
  <div class="warnbox"><b>Перезапусків у цій сесії: ${S.resets}</b>
    Менеджер побачить це число у звіті. Один раз — буває. Кілька разів поспіль — привід поговорити.</div>
  <button class="btn" id="again">Почати ${BANK[S.test].title.toLowerCase()} заново</button>
  <button class="btn ghost" id="back">До списку тестів</button>`;
}

function testDone(){
  const r=S.results[S.test], ok=r.p>=GATE;
  return head()+`
  <h1>${BANK[S.test].title}</h1>
  <div class="bignum" style="color:${ok?'var(--ok)':'var(--no)'}">${nf(r.p)}%</div>
  <p class="lead">${r.correct} з ${r.total} правильно. ${ok?`Поріг ${GATE}% пройдено.`:`Поріг ${GATE}% не пройдено — цей тест треба перескласти.`}</p>
  ${r.wrong.length?`<h2 style="margin-top:24px">Розібрати помилки</h2>
    ${r.wrong.map(w=>`<div class="explain"><b>${esc(w.q)}</b>
      <div class="ans no"><span>Твоя відповідь</span>${esc(w.given)}</div>
      <div class="ans ok"><span>Правильно</span>${esc(w.right)}</div>
      ${esc(w.why)}</div>`).join("")}`:""}
  <button class="btn" id="back">До списку тестів</button>`;
}

function final(){
  const rs=ORDER.map(k=>S.results[k]);
  const gate=rs.every(r=>r.p>=GATE);
  const avg=Math.round(rs.reduce((s,r)=>s+r.p,0)/3*10)/10;
  const t=gate?tierOf(avg):TIERS[3];
  return head()+`
  <h1>Підсумок атестації</h1>
  <p class="lead">${esc(S.name||"Без імені")} · ${new Date().toLocaleDateString("uk-UA")}</p>
  <div class="rows">
    ${ORDER.map(k=>`<div class="row"><span>${BANK[k].title}</span>
      <b class="${S.results[k].p>=GATE?'pass':'fail'}">${nf(S.results[k].p)}%</b></div>`).join("")}
    <div class="row"><span>Середній бал</span><b>${nf(avg)}%</b></div>
    <div class="row"><span>Перезапусків</span><b class="${S.resets>2?'fail':''}">${S.resets}</b></div>
  </div>
  ${!gate?`<div class="warnbox"><b>Надбавка не нараховується</b>
    Хоча б один тест нижче ${GATE}%. Кухня, бар і сервіс мають бути пройдені всі три.</div>`:""}
  <div class="ladder">
    ${TIERS.slice().reverse().map((x,idx)=>{
      const on=gate?x===t:x.add===0;
      return `<div class="rung ${on?'on':''}">${face(idx)}
        <span class="pc">${nf(BASE+x.add)}%</span>
        <span class="lb">${x.add?`+${nf(x.add)} · від ${x.min}%`:"нижче порога"}</span></div>`}).join("")}
  </div>
  <div class="bignum">${nf(BASE+t.add)}%</div>
  <p class="lead">${t.label}. Це твій відсоток на наступний квартал.</p>
  <div class="note" id="sendstate">${CONFIG.endpoint
    ? "Результат надіслано менеджеру автоматично."
    : "Надішли результат менеджеру — кнопка нижче копіює звіт у буфер."}</div>
  <button class="btn" id="copy">Скопіювати звіт для менеджера</button>
  <button class="btn ghost" id="back">До списку тестів</button>`;
}

function manager(){
  if(S.pin!==CONFIG.managerPin){
    return head()+`<h1>Для менеджера</h1>
    <p class="lead">Введи пін-код, щоб побачити налаштування і звіт.</p>
    <div class="field"><label>Пін-код</label>
      <input id="pin" type="tel" inputmode="numeric" placeholder="4 цифри"></div>
    <button class="btn" id="dopin">Увійти</button>
    <button class="btn ghost" id="back">Назад</button>`;
  }
  const any=ORDER.some(k=>S.results[k]);
  return head()+`<h1>Для менеджера</h1>
  <div class="rows">
    <div class="row"><span>Куди йдуть результати</span><b>${CONFIG.endpoint?"Google Таблиця":"Тільки на екран"}</b></div>
    <div class="row"><span>Секунд на питання</span><b>${CONFIG.secondsPerQuestion||"без ліміту"}</b></div>
    <div class="row"><span>Обнулення при виході</span><b>${CONFIG.resetOnLeave?"увімкнено":"вимкнено"}</b></div>
    <div class="row"><span>Поріг допуску</span><b>${GATE}%</b></div>
  </div>
  <h2 style="margin-top:26px">Звіт поточної сесії</h2>
  ${any?`<div class="explain" style="white-space:pre-wrap">${esc(reportText())}</div>
  <button class="btn" id="copy">Скопіювати звіт</button>`
  :`<p class="lead">Ще нічого не складено в цій сесії.</p>`}
  <div class="note">Пін-код і адресу таблиці змінюють у блоці НАЛАШТУВАННЯ на початку файлу.</div>
  <button class="btn ghost" id="back">Назад</button>`;
}

function importer(){
  return head()+`
  <h1>Додати питання</h1>
  <p class="lead">Скопіюй рядки з Excel і встав сюди. Колонки через табуляцію:</p>
  <div class="explain"><b>Формат</b>тест · питання · варіант А · Б · В · Г · номер правильного (1–4) · пояснення<br><br>
  У колонці «тест» пиши: кухня, бар або сервіс.</div>
  <textarea id="ta" placeholder="кухня&#9;Скільки грамів у порції рису?&#9;150&#9;200&#9;250&#9;300&#9;2&#9;Стандартна порція — 200 г."></textarea>
  <button class="btn" id="doimp">Додати до банку</button>
  <button class="btn ghost" id="back">Назад</button>
  <div class="note">Питання додаються тільки на цьому пристрої й до перезавантаження. Щоб зафіксувати назавжди — надішли таблицю, і я вшию її у файл.</div>`;
}

/* ---------- завершення питання ---------- */
function commit(timeout){
  S.answers.push({q:S.qs[S.i],pick:timeout?-1:S.picked});
  if(S.i+1<S.qs.length){
    S.i++;S.picked=null;render();startTimer();
  }else{
    stopTimer();guardOff();S.screen="open";render();
  }
}

function finish(openAnswer){
  const correct=S.answers.filter(a=>a.pick===a.q[2]).length;
  const r={p:pct(correct,S.answers.length),correct,total:S.answers.length,
    secs:Math.round((Date.now()-S.startedAt)/1000),
    open:{q:OPEN_Q[S.test],a:openAnswer},
    wrong:S.answers.filter(a=>a.pick!==a.q[2]).map(a=>({
      q:a.q[0],
      given:a.pick>=0?a.q[1][a.pick]:"— не встиг відповісти",
      timeout:a.pick<0,
      right:a.q[1][a.q[2]],
      why:a.q[3]}))};
  S.results[S.test]=r;
  if(!S.sent[S.test]){
    S.sent[S.test]=1;
    send(payload("test",{test:BANK[S.test].title,score:r.p,correct:r.correct,
      total:r.total,seconds:r.secs,
      timeouts:r.wrong.filter(w=>w.timeout).length,
      wrong:r.wrong.map(w=>`${w.q}\n   відповів: ${w.given}\n   правильно: ${w.right}`).join("\n\n"),
      openQ:r.open.q, openA:r.open.a}));
  }
  S.screen="test-done";render();
}

function startTest(key){
  const nm=document.getElementById("nm"); if(nm) S.name=nm.value;
  if(!nameOk()){
    const h=document.getElementById("nmhint"); if(h)h.style.display="block";
    if(nm)nm.focus();
    return;
  }
  S.test=key;S.qs=draw();S.i=0;S.picked=null;S.answers=[];
  S.startedAt=Date.now();S.screen="quiz";
  render();guardOn();startTimer();
}

/* ---------- події ---------- */
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;

  if(t.dataset.test){startTest(t.dataset.test);return}
  if(t.dataset.opt!==undefined){S.picked=+t.dataset.opt;render();return}
  if(t.id==="nx"){commit(false);return}
  if(t.id==="again"){startTest(S.test);return}

  if(t.id==="doneopen"){
    const ta=document.getElementById("oa");
    const v=(ta.value||"").trim();
    if(v.length<CONFIG.minOpenLength){
      document.getElementById("oahint").style.display="block"; ta.focus(); return;
    }
    finish(v);return}

  if(t.id==="back"){stopTimer();guardOff();S.screen="home";render();return}
  if(t.id==="fin"){
    S.screen="final";render();
    if(!S.sent.final){
      S.sent.final=1;
      const rs=ORDER.map(k=>S.results[k]);
      const gate=rs.every(r=>r.p>=GATE);
      const avg=Math.round(rs.reduce((s,r)=>s+r.p,0)/3*10)/10;
      const tr=gate?tierOf(avg):TIERS[3];
      send(payload("final",{average:avg,passed:gate?"так":"ні",
        percent:BASE+tr.add,tier:tr.label}));
    }
    return}

  if(t.id==="mgr"){S.screen="manager";render();return}
  if(t.id==="imp"){S.screen="import";render();return}
  if(t.id==="dopin"){S.pin=(document.getElementById("pin")||{}).value||"";render();return}

  if(t.id==="copy"){
    const txt=reportText();
    const done=()=>{const el=document.getElementById("sendstate");
      if(el)el.textContent="Звіт скопійовано — вставляй у чат менеджеру.";};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,()=>alert(txt));
    }else alert(txt);
    return}

  if(t.id==="doimp"){
    const map={"кухня":"kitchen","бар":"bar","сервіс":"service"};
    let n=0;
    (document.getElementById("ta").value||"").split("\n").forEach(line=>{
      const c=line.split("\t").map(x=>x.trim());
      if(c.length<7) return;
      const k=map[c[0].toLowerCase()]; const ri=parseInt(c[6],10)-1;
      if(!k||isNaN(ri)||ri<0||ri>3) return;
      const opts=[c[2],c[3],c[4],c[5]].filter(Boolean);
      if(opts.length<2||ri>=opts.length) return;
      BANK[k].q.push([c[1],opts,ri,c[7]||""]);n++;
    });
    alert(n?`Додано питань: ${n}`:"Не додано жодного. Перевір табуляцію і номер правильної відповіді (1–4).");
    S.screen="home";render();return}
});

app.addEventListener("input",e=>{
  if(e.target.id==="nm"){
    S.name=e.target.value;
    const ok=nameOk();
    document.querySelectorAll("[data-test]").forEach(b=>b.disabled=!ok);
    const h=document.getElementById("nmhint"); if(h) h.style.display=ok?"none":"block";
  }
  if(e.target.id==="oa"){
    const h=document.getElementById("oahint");
    if(h&&e.target.value.trim().length>=CONFIG.minOpenLength) h.style.display="none";
  }
});
document.addEventListener("contextmenu",e=>{if(S.screen==="quiz")e.preventDefault()});
render();

</script>
